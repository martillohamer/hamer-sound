<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dj. hammer</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="console" id="console"><!-- Reloj LED arriba a la izquierda --><div class="led-clock"><span class="led-digits" id="led-clock">00:00</span><div class="led-label">dj. hammer</div></div><!-- Botones pequeños arriba a la derecha: cfg, i, stby, exit --><div class="top-btns"><button id="btn-cfg" aria-label="Configuración">cfg</button><button id="btn-info" aria-label="Ayuda">i</button><button id="btn-stby" aria-label="Standby">stby</button><button id="btn-exit" aria-label="Salir">exit</button></div><!-- Two players simétricos --><div class="rows"><!-- PLAYER A a la izquierda --><section class="player player-a" id="player-a"><!-- Pantalla LCD ≈250×112 --><div class="lcd"><!-- Franja superior fina teal (barra de progreso) --><div class="lcd-bar"><i></i></div><!-- Texto de estado a la izquierda ("CLOSED", "PLAYING"...) --><div class="lcd-status" id="player-a-status">CLOSED</div><!-- "Elapsed" y "Remaining" con dígitos de 7 segmentos grandes (mm:ss.cc) --><div class="lcd-timer"><span class="seg7-el" id="player-a-elapsed">00:00.0</span>/<span class="seg7-re" id="player-a-remaining">-00:00.0</span></div><!-- Abajo 2 líneas de mensaje (título de la pista o error) --><div class="lcd-msg" id="player-a-msg"></div></div><!-- Botón INFO arriba a la derecha de la pantalla --><button class="lcd-info" aria-label="Información de pista">INFO</button><!-- Vúmetro vertical segmentado ≈18×110 a la derecha de la pantalla --><div class="vu-meter" id="player-a-vu"><div class="vu-segment" data-level="-15"></div><div class="vu-segment" data-level="-13"></div><div class="vu-segment" data-level="-10"></div><div class="vu-segment" data-level="-8"></div><div class="vu-segment" data-level="-5"></div><div class="vu-segment" data-level="-3"></div><div class="vu-segment" data-level="-3"></div><div class="vu-segment" data-level="-8"></div><div class="vu-segment" data-level="-10"></div><div class="vu-segment" data-level="-13"></div><div class="vu-segment" data-level="-15"></div><div class="vu-segment" data-level="-15"></div></div><!-- Bloque PITCH: etiqueta, mini pantalla "00.00", botones − y +, fader vertical largo (−24 arriba, +24 abajo) con marcas de escala, y a su derecha 3 mini botones apilados (▲ ◆ ▼) --><div class="pitch-block"><span class="pitch-label">PITCH</span><span class="pitch-value" id="player-a-pitch">0.0%</span><button data-pitch-minus>−</button><input type="range" class="pitch-fader" min="-24" max="24" step=".5" value="0" data-pitch-fader><button data-pitch-plus>+</button><button data-pitch-default◆>◆</button></div><!-- Fila inferior: etiqueta "PLAYER A", tira de 12 LEDs rojos pequeños, botones de pista |◀ 0 ▶|, botón CUE grande, botón Play/Pausa ▶❚❚ grande, botón expulsar ▲ (violeta), botón "=" y botones « » --><div class="player-footer"><span class="player-label">PLAYER A</span><div class="led-strip" id="player-a-leds"></div><div class="player-controls"><button data-track-prev>|◀ 0 ▶|</button><button data-cue>CUE</button><button data-play>▶❚❚</button><button data-expel▲ style="background:var(--expel-violet);color:#fff">▲</button><button data-track-eq>=</button><button data-track-rew>«</button><button data-track-ff">»</button></div></div></section><!-- PLAYER B a la derecha --><section class="player player-b" id="player-b"><div class="lcd"><div class="lcd-bar"><i></i></div><div class="lcd-status" id="player-b-status">CLOSED</div><div class="lcd-timer"><span class="seg7-el" id="player-b-elapsed">00:00.0</span>/<span class="seg7-re" id="player-b-remaining">-00:00.0</span></div><div class="lcd-msg" id="player-b-msg"></div><button class="lcd-info" aria-label="Información de pista">INFO</button></div><div class="vu-meter" id="player-b-vu"><div class="vu-segment" data-level="-15"></div><div class="vu-segment" data-level="-13"></div><div class="vu-segment" data-level="-10"></div><div class="vu-segment" data-level="-8"></div><div class="vu-segment" data-level="-5"></div><div class="vu-segment" data-level="-3"></div><div class="vu-segment" data-level="-3"></div><div class="vu-segment" data-level="-8"></div><div class="vu-segment" data-level="-10"></div><div class="vu-segment" data-level="-13"></div><div class="vu-segment" data-level="-15"></div><div class="vu-segment" data-level="-15"></div></div><div class="pitch-block"><span class="pitch-label">PITCH</span><span class="pitch-value" id="player-b-pitch">0.0%</span><button data-pitch-minus>−</button><input type="range" class="pitch-fader" min="-24" max="24" step=".5" value="0" data-pitch-fader><button data-pitch-plus>+</button><button data-pitch-default◆>◆</button></div><div class="player-footer"><span class="player-label">PLAYER B</span><div class="led-strip" id="player-b-leds"></div><div class="player-controls"><button data-track-prev>|◀ 0 ▶|</button><button data-cue>CUE</button><button data-play>▶❚❚</button><button data-expel▲ style="background:var(--expel-violet);color:#fff">▲</button><button data-track-eq>=</button><button data-track-rew>«</button><button data-track-ff">»</button></div></section></div><!-- Mixer (232–400): fondo rojo hundido con 4 tornillos en las esquinas --><div class="mixer"><div class="mixer-h"><span></span><span></span><span></span><span></span></div><div class="chan"><b>A</b><input type="range" class="vf" id="vol-a" min="0" max="1" step=".01" value=".8"><small>vol</small></div><div class="chan"><b>B</b><input type="range" class="vf" id="vol-b" min="0" max="1" step=".01" value=".8"><small>vol</small></div><div class="mid"><canvas id="vu-meter" width="90" height="110"></canvas><input type="range" id="crossfader" min="-1" max="1" step=".01" value="0"><small>crossfade <span id="cf-value">50%</span></small><small>master <input type="range" id="master" min="0" max="1" step=".01" value=".8"></small></div><div class="chan"><b>B</b><input type="range" class="vf" id="vol-b2" min="0" max="1" step=".01" value=".8"><small>vol</small></div></div><!-- Biblioteca (405 hasta abajo): pestaña "Default" y botón "edit recordcase" arriba a la izquierda --><section class="library"><div class="lib-header"><span>Default</span><button id="btn-edit-recordcase" aria-label="Editar ficha">edit recordcase</button></div><div class="lib-table"><table><thead><tr><th><span class="sort-indicator">✓</span></th><th>bpm</th><th>artist</th><th>trackname</th><th>version</th><th>comment</th></tr></thead><tbody id="library-rows"></tbody></table></div><div class="lib-empty" id="lib-empty">Arrastra aquí tus MP3 o pulsa «+ Añadir MP3»</div></section><div class="lib-controls"><input type="text" id="lib-filter" placeholder="Filtrar artista/título"><button id="btn-auto">AUTO</button><label><input type="checkbox" id="chk-shuffle">SHFL</label><label><input type="checkbox" id="chk-hide-hidden">Ocultar ✓</label><button id="btn-reset">Reiniciar ✓</button></div></section></div><div class="status">Pistas: <span id="track-count">0</span> · Doble clic = cargar · Arrastra una fila a un player</div></body><script src="js/audio.js" defer></script><script src="js/seg7.js" defer></script><script src="js/controls.js" defer></script><script src="js/deck.js" defer></script><script src="js/library.js" defer></script><script src="js/main.js" defer></script></body></html>
